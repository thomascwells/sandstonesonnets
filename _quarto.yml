project:
  type: website

  render:
    - "*.qmd"

  resources:
    - "files/**"
    - "poems/images/share.jpg"

freeze: auto

website:
  title: "Sandstone Sonnets"
  favicon: "/poems/images/favicon.png"
  site-url: "https://sandstonesonnets.com/"
  description: "Short, fun poems about rock formations on the trails around Fruita, Colorado. A scavenger hunt for hikers."
  image: "poems/images/share.jpg"
  open-graph: true
  twitter-card:
    card-style: summary
  repo-url: "https://github.com/thomascwells/sandstonesonnets"
  repo-actions: [edit, issue]
  bread-crumbs: true
  navbar:
    pinned: false
    logo: "/poems/images/logo.webp"
    logo-alt: "Sandstone Sonnets logo"
    left:
      - href: index.qmd
        text: Home
      - href: faq.qmd
        text: FAQ
      # - text: group1
      #   menu:
      #   - text: About the Author
      #     href: https://thomascwells.com
      #   - text: Source Code
      #     href: https://github.com/thomascwells/sandstonesonnets
      # - text: group 2
    # right:
    #   - icon: rss
    #     href: index.xml
  margin-header: |
    ![](/poems/images/logo.webp){fig-alt="Sandstone Sonnets logo"}
      
format:
  html:
    theme: 
      - lumen
      # - html/styles.scss
#    grid: 
#      body-width: 900px
    toc: false
#    highlight-style: monokai
    css: styles.css

filters:
  - lazy-images.lua

  
  
  
